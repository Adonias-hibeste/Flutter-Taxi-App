name: flutter_taxi_app
description: Professional ride-hailing application with real-time tracking and fare estimation.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.5.3
  flutter_polyline_points: ^2.0.0
  geolocator: ^10.1.0
  flutter_riverpod: ^2.4.9
  google_fonts: ^6.1.0
  lucide_icons: ^0.322.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
